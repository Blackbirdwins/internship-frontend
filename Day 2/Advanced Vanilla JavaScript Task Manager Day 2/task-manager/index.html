<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anas Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1>📝 Anas's Task Manager</h1>
        <button id="themeToggle" aria-label="Toggle theme">🌙</button>
    </header>

    <main>
        <section class="form-section">
            <h2>Add New Task</h2>
            <form id="taskForm" novalidate>
                <input type="text" id="taskTitle" placeholder="Task title" required>
                <select id="taskPriority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
                <input type="date" id="taskDueDate">
                <button type="submit">Add Task</button>
                <p id="formError" class="error" role="alert"></p>
            </form>
        </section>

        <section class="controls">
            <input type="search" id="searchInput" placeholder="Search tasks...">
            <select id="filterStatus">
                <option value="all">All</option>
                <option value="active">Active</option>
                <option value="completed">Completed</option>
            </select>
            <select id="sortBy">
                <option value="date">Sort: Date</option>
                <option value="priority">Sort: Priority</option>
                <option value="title">Sort: Title</option>
            </select>
            <button id="analyticsBtn">📊 Analytics</button>
        </section>

        <section class="tasks-section">
            <h2>Your Tasks (<span id="taskCount">0</span>)</h2>
            <ul id="taskList" class="task-list"></ul>
            <p id="emptyState" class="empty">No tasks yet. Add one above!</p>
        </section>

        <section class="api-section">
            <h2>API Panel — Users</h2>
            <button id="fetchUsersBtn">Fetch Users</button>
            <div id="apiOutput"></div>
        </section>

        <div id="analyticsPanel" class="analytics-panel"></div>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
